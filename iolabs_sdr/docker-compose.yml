version: "3.9"

# IOlabs AI SDR Platform — Docker Compose
# Services: api, 6x celery workers, celery_beat, redis, postgres

x-celery-common: &celery-common
  build: .
  env_file: .env
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  # ── PostgreSQL with pgvector ──────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iolabs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-iolabs_sdr}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iolabs} -d ${POSTGRES_DB:-iolabs_sdr}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis (broker + cache) ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── FastAPI Application ────────────────────────────────────────────────────
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Celery Workers (one per pipeline stage) ────────────────────────────────
  worker_discovery:
    <<: *celery-common
    command: celery -A core.celery_app worker -Q discovery --loglevel=info --concurrency=2 --hostname=worker_discovery@%h

  worker_classify:
    <<: *celery-common
    command: celery -A core.celery_app worker -Q classify --loglevel=info --concurrency=4 --hostname=worker_classify@%h

  worker_enrich:
    <<: *celery-common
    command: celery -A core.celery_app worker -Q enrich --loglevel=info --concurrency=4 --hostname=worker_enrich@%h

  worker_email:
    <<: *celery-common
    command: celery -A core.celery_app worker -Q email --loglevel=info --concurrency=2 --hostname=worker_email@%h

  worker_reply:
    <<: *celery-common
    command: celery -A core.celery_app worker -Q reply --loglevel=info --concurrency=4 --hostname=worker_reply@%h

  worker_linkedin:
    <<: *celery-common
    command: celery -A core.celery_app worker -Q linkedin --loglevel=info --concurrency=2 --hostname=worker_linkedin@%h

  # ── Celery Beat (scheduler for periodic tasks) ─────────────────────────────
  celery_beat:
    <<: *celery-common
    command: celery -A core.celery_app beat --loglevel=info --scheduler celery.beat.PersistentScheduler
    volumes:
      - beat_data:/var/celery

volumes:
  postgres_data:
  redis_data:
  beat_data:
