[pytest]
asyncio_mode = auto
# Run from the REPO ROOT (personal-coo-backend/), not from iolabs_sdr/.
# The local email/ package shadows stdlib email.message — running from parent
# avoids the sys.path conflict.
# Command: cd personal-coo-backend && python -m pytest iolabs_sdr/tests/ -v
testpaths = iolabs_sdr/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: marks tests requiring live PostgreSQL + Redis (deselect with -m "not integration")
    unit: marks fast unit tests with no external dependencies
filterwarnings =
    ignore::DeprecationWarning
