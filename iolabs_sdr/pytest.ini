[pytest]
asyncio_mode = auto
# Run from the REPO ROOT (personal-coo-backend/):
#   python -m pytest iolabs_sdr/tests/ -v
#
# iolabs_sdr/ is a proper Python package (has __init__.py).
# This ensures iolabs_sdr.email does NOT shadow stdlib email.message.
# All internal imports use the iolabs_sdr.* prefix.
testpaths = iolabs_sdr/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: marks tests requiring live PostgreSQL + Redis (deselect with -m "not integration")
    unit: marks fast unit tests with no external dependencies
filterwarnings =
    ignore::DeprecationWarning
